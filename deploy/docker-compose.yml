services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wichat
      POSTGRES_PASSWORD: wichat
      POSTGRES_DB: wichat
    ports:
      - "5432:5432"
    volumes:
      - wichat-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wichat -d wichat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  wichat-postgres:
