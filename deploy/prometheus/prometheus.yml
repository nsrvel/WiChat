global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ms-auth
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels:
          service: ms-auth
  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: gateway
